AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dedicated Greenhouse Monitor backend foundation. Not deployed by this repository.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
  OfflineTimeoutSeconds:
    Type: Number
    Default: 180
    MinValue: 120
    MaxValue: 900

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref ApplicationTable
        ENVIRONMENT_NAME: !Ref EnvironmentName
        OFFLINE_TIMEOUT_SECONDS: !Ref OfflineTimeoutSeconds

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub greenhouse-monitor-${EnvironmentName}-users
      UserPoolTier: PLUS
      DeletionProtection: ACTIVE
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  AndroidUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub greenhouse-monitor-${EnvironmentName}-android
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  ApplicationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub greenhouse-monitor-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: heartbeatShard
          AttributeType: N
        - AttributeName: lastHeartbeat
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: heartbeats
          KeySchema:
            - AttributeName: heartbeatShard
              KeyType: HASH
            - AttributeName: lastHeartbeat
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [accountId, tenantId, deviceId, greenhouseId, enabled]
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      CorsConfiguration:
        AllowHeaders: [authorization, content-type, x-greenhouse-device-id]
        AllowMethods: [GET, POST, DELETE]
        AllowOrigins: ['https://invalid.local']
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref AndroidUserPoolClient]
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","routeKey":"$context.routeKey","responseLength":"$context.responseLength"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/greenhouse-monitor/${EnvironmentName}/api
      RetentionInDays: 30

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/greenhouse-monitor-${EnvironmentName}-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiFunctionLogGroup
    Properties:
      FunctionName: !Sub greenhouse-monitor-${EnvironmentName}-api
      CodeUri: ../backend/src/
      Handler: app.handler
      ReservedConcurrentExecutions: 20
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationTable
        - Statement:
            - Sid: ManageGreenhouseSignalingChannels
              Effect: Allow
              Action:
                - kinesisvideo:CreateSignalingChannel
                - kinesisvideo:DescribeSignalingChannel
                - kinesisvideo:GetSignalingChannelEndpoint
                - kinesisvideo:GetIceServerConfig
                - kinesisvideo:ConnectAsViewer
                - kinesisvideo:ConnectAsMaster
              Resource: '*'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/{proxy+}
            Method: ANY

  CriticalAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub greenhouse-monitor-${EnvironmentName}-critical-alerts
      KmsMasterKeyId: alias/aws/sns

  OperationsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub greenhouse-monitor-${EnvironmentName}-operations
      KmsMasterKeyId: alias/aws/sns

  HeartbeatMonitorDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub greenhouse-monitor-${EnvironmentName}-heartbeat-dlq
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  HeartbeatMonitorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/greenhouse-monitor-${EnvironmentName}-heartbeat-monitor
      RetentionInDays: 30

  EntitlementAdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/greenhouse-monitor-${EnvironmentName}-entitlement-admin
      RetentionInDays: 90

  EntitlementAdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: EntitlementAdminLogGroup
    Properties:
      FunctionName: !Sub greenhouse-monitor-${EnvironmentName}-entitlement-admin
      CodeUri: ../backend/src/
      Handler: entitlement_admin.handler
      ReservedConcurrentExecutions: 1
      Policies:
        - Statement:
            - Sid: ReadAndUpdateAccountEntitlements
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ApplicationTable.Arn

  HeartbeatMonitorFunction:
    Type: AWS::Serverless::Function
    DependsOn: HeartbeatMonitorLogGroup
    Properties:
      FunctionName: !Sub greenhouse-monitor-${EnvironmentName}-heartbeat-monitor
      CodeUri: ../backend/src/
      Handler: heartbeat_monitor.handler
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref CriticalAlertTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CriticalAlertTopic.TopicName
      Events:
        MinuteCheck:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            DeadLetterConfig:
              Arn: !GetAtt HeartbeatMonitorDeadLetterQueue.Arn
            RetryPolicy:
              MaximumEventAgeInSeconds: 3600
              MaximumRetryAttempts: 2
            FlexibleTimeWindow:
              Mode: 'OFF'

  ApiFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Greenhouse API Lambda returned an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsAlertTopic]

  ApiFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Greenhouse API Lambda is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsAlertTopic]

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Greenhouse HTTP API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref EnvironmentName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsAlertTopic]

  HeartbeatMonitorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled greenhouse heartbeat monitor returned an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HeartbeatMonitorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsAlertTopic]

  HeartbeatDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A scheduled heartbeat check exhausted its retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt HeartbeatMonitorDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsAlertTopic]

  EntitlementAdminErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: IAM-only entitlement administration Lambda returned an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EntitlementAdminFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsAlertTopic]

Outputs:
  AwsRegion:
    Value: !Ref AWS::Region
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
  UserPoolId:
    Value: !Ref UserPool
  AndroidClientId:
    Value: !Ref AndroidUserPoolClient
  OperationsAlertTopicArn:
    Description: Subscribe an approved operations destination after deployment
    Value: !Ref OperationsAlertTopic
  EntitlementAdminFunctionName:
    Description: IAM-restricted function for complimentary grants, revocation, and Free reset
    Value: !Ref EntitlementAdminFunction

