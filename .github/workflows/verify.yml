name: Verify Greenhouse Monitor

on:
  push:
    branches: [codex/greenhouse-complete-upgrade, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Android tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Backend policy tests
        run: python -m unittest discover -s backend/tests -v
      - name: Backend syntax validation
        run: python -m py_compile backend/src/*.py
      - name: AWS SAM template lint
        run: cfn-lint infrastructure/template.yaml
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: greenhouse-monitor-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
